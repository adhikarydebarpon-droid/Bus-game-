<style>
/* Layout: full-bleed 3D canvas, HUD pinned over it in a centered column (max 520px) so it reads as a phone game on any screen. */
:root {
  --bg: #1d2230;
  --panel: rgba(38, 42, 59, 0.9);
  --panel-line: #4a5170;
  --gold: #f0b90b;
  --gold-deep: #b98500;
  --gold-ink: #2a1f00;
  --ok: #3ddc84;
  --warn: #ff6b5a;
  --ink: #f6f3ea;
  --dim: #b4bace;
  --font: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#app { position: relative; height: 100%; width: 100%; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #c4c8ce; }
#hud { position: absolute; inset: 0; pointer-events: none; }
.col { position: relative; height: 100%; max-width: 520px; margin: 0 auto; }
.col > * { position: absolute; }
button { font-family: var(--font); pointer-events: auto; cursor: pointer; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

.row { left: var(--gl); right: var(--gr); display: flex; gap: 8px; align-items: center; }
.r1 { top: 10px; }
.r2 { top: 56px; }
.r3 { top: 102px; }
.pill {
  display: flex; align-items: center; gap: 7px;
  height: 36px; padding: 0 12px;
  background: var(--panel);
  border: 2px solid var(--panel-line);
  border-radius: 999px;
  font-size: 15px; font-weight: 700;
  white-space: nowrap;
  min-width: 0;
}
.pill svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pill b { font-weight: 700; font-variant-numeric: tabular-nums; }
.hp { flex: 1 1 0; border-color: var(--ok); color: var(--ink); }
.gold { background: #f6c93a; border-color: #ffe08a; color: var(--gold-ink); }
.route { flex: 1 1 auto; justify-content: space-between; }
.route span { overflow: hidden; text-overflow: ellipsis; }
.comfort { border-color: var(--warn); color: var(--ink); }
.bar { flex: 1; height: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.2); overflow: hidden; min-width: 40px; }
.bar i { display: block; height: 100%; width: 100%; background: var(--ok); border-radius: 6px; transition: width 0.2s; }
.fuel { width: 150px; }
.round {
  width: 48px; height: 48px; padding: 0; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.7);
  background: rgba(60, 64, 80, 0.55);
  color: #fff; display: grid; place-items: center;
  backdrop-filter: blur(3px);
}
.round svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#bLight.on { background: rgba(246, 216, 74, 0.92); color: #3a2a00; border-color: #ffe69a; }
.round:active { background: rgba(240, 185, 11, 0.7); }
#pauseBtn { margin-left: auto; }
#fps { top: 150px; left: calc(var(--gl) + 92px); height: 24px; padding: 0 8px; font-size: 12px; }
#mini {
  top: 150px; left: var(--gl); width: 84px; height: 84px;
  border-radius: 16px; border: 2px solid #fff; background: #dfe8de;
}
#speedo { top: 150px; right: var(--gr); width: 100px; height: 100px; }
#speedo svg { width: 100%; height: 100%; display: block; }
#speedo .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; padding-bottom: 6px; }
#speedo .num b { font-size: 34px; font-weight: 700; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5); font-variant-numeric: tabular-nums; }
#speedo .num small { font-size: 11px; color: var(--dim); margin-top: 2px; }
#speedo .num em { font-style: normal; color: var(--gold); font-weight: 700; font-size: 15px; margin-top: 4px; }
#limit {
  position: absolute; top: -8px; left: -12px; width: 34px; height: 34px; border-radius: 50%;
  background: #fff; border: 4px solid #d93a2f; color: #111; font-weight: 700; font-size: 14px;
  display: grid; place-items: center;
}
.side { top: 262px; right: var(--gr); display: flex; flex-direction: column; gap: 10px; }
#bubble {
  max-width: 220px; padding: 8px 12px 9px; border-radius: 14px;
  background: #fdf2da; color: #2b1d0e; font-size: 17px; font-weight: 700; line-height: 1.25;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}
#bubble small { display: block; color: #b33a2a; font-size: 12px; font-weight: 700; }
#helper {
  left: var(--gl); bottom: 212px; max-width: 230px; padding: 8px 12px 9px; border-radius: 14px;
  background: #1d3a1f; color: #f6f3ea; border: 2px solid #3fae5a; font-size: 17px; font-weight: 700; line-height: 1.25;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}
#helper small { display: block; color: #8fe0a2; font-size: 12px; font-weight: 700; }
#toast {
  top: 232px; left: 50%; transform: translateX(-50%);
  background: rgba(20, 24, 36, 0.88); color: var(--ink);
  border: 2px solid var(--gold); border-radius: 12px;
  padding: 8px 14px; font-size: 16px; font-weight: 600; text-align: center;
  max-width: 78%; white-space: normal;
}
.ctl { left: 0; right: 0; bottom: 14px; height: 190px; }
.pad {
  position: absolute;
  border: 3px solid #ffe69a;
  background: linear-gradient(180deg, #f8cf3c, #e7a900);
  color: #3a2a00;
  box-shadow: 0 5px 0 var(--gold-deep), 0 8px 14px rgba(0, 0, 0, 0.35);
  font-weight: 700; font-size: 15px;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px;
}
.pad:active, .pad.on { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold-deep); background: linear-gradient(180deg, #ffe064, #f0b90b); }
.pad svg { position: absolute; inset: 0; margin: auto; width: 46%; height: 46%; fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
.pad.steer { width: 78px; height: 78px; border-radius: 50%; bottom: 0; }
#bL { left: var(--gl); }
#bR { left: calc(var(--gl) + 90px); }
#bBrake { right: calc(var(--gr) + 92px); bottom: 0; width: 86px; height: 86px; border-radius: 16px; }
#bGas { right: var(--gr); bottom: 0; width: 76px; height: 150px; border-radius: 16px; }
.pad.stripes::before {
  content: ""; position: absolute; inset: 10px 10px 30px; border-radius: 8px;
  background: repeating-linear-gradient(135deg, rgba(255,255,255,0.65) 0 10px, transparent 10px 22px);
}

#veil { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(220, 40, 30, 0.55)); opacity: 0; transition: opacity 0.2s; }
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(14, 17, 27, 0.78);
  padding-block: 16px;
  padding-left: var(--gl); padding-right: var(--gr);
}
.card { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
.card h1 { margin: 0; font-size: 38px; line-height: 1.15; font-weight: 700; color: var(--gold); text-wrap: balance; }
.card p { margin: 0; color: var(--dim); font-size: 16px; line-height: 1.55; }
.card ul { margin: 0; padding-left: 20px; color: var(--ink); font-size: 15px; line-height: 1.7; }
.sum { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.sum div { background: var(--panel); border: 2px solid var(--panel-line); border-radius: 12px; padding: 8px 10px; font-size: 13px; color: var(--dim); }
.sum b { display: block; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
.go {
  appearance: none; border: 0; background: var(--gold); color: var(--gold-ink);
  font-size: 22px; font-weight: 700; padding: 11px 16px 12px; border-radius: 12px;
  box-shadow: 0 4px 0 var(--gold-deep);
}
.go:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--gold-deep); }
[hidden] { display: none !important; }
@media (max-height: 640px) {
  .r3 { display: none; }
  #mini, #speedo { top: 104px; }
  .side { top: 214px; }
  #toast { top: 190px; }
}

#splash { position: absolute; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 35%, #1f4a33, #0a120e 72%); transition: opacity 0.6s; }
.spInner { width: min(88%, 430px); text-align: center; color: #fff; }
.logoImg { display: block; width: 100%; height: auto; max-height: 62vh; object-fit: contain; margin: 0 auto; border-radius: 18px; box-shadow: 0 8px 26px rgba(0, 0, 0, 0.55); }
.wm { text-align: center; line-height: 1.05; font-family: "Hind Siliguri", system-ui, sans-serif; }
.wm1 { font-size: 40px; font-weight: 800; letter-spacing: 3px; color: #f6d84a; text-shadow: 0 3px 0 #8a6a00; }
.wm2 { font-size: 30px; font-weight: 800; letter-spacing: 6px; color: #fff; }
.wm3 { margin-top: 8px; font-size: 13px; font-weight: 700; letter-spacing: 3px; color: #8fe0a2; }
.spBar { height: 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.16); margin-top: 28px; overflow: hidden; }
.spBar i { display: block; height: 100%; width: 0; background: #f0b90b; animation: splBar 2.2s ease forwards; }
@keyframes splBar { to { width: 100%; } }
.spTip { margin-top: 10px; font-size: 13px; color: rgba(255, 255, 255, 0.7); }
.menuLogo { margin: 2px 0 12px; }
.menuLogo .logoImg { width: auto; max-width: 100%; max-height: 26vh; border-radius: 14px; }
.card { max-height: 94vh; overflow-y: auto; }
.menuLogo .wm1 { font-size: 30px; } .menuLogo .wm2 { font-size: 22px; } .menuLogo .wm3 { font-size: 11px; }
.seg { display: flex; gap: 8px; margin: 10px 0; }
.seg button { flex: 1; padding: 8px 6px; border-radius: 12px; border: 2px solid rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.06); color: #fff; font: 700 14px "Hind Siliguri", sans-serif; }
.seg button small { display: block; font-size: 11px; font-weight: 600; opacity: 0.75; }
.seg button.on { border-color: #f0b90b; background: rgba(240, 185, 11, 0.22); }
.howto { margin: 6px 0 12px; text-align: left; font-size: 14px; }
.howto summary { cursor: pointer; font-weight: 700; color: #f0b90b; padding: 4px 0; }
.stoplist { max-height: 38vh; overflow: auto; margin: 8px 0 12px; text-align: left; font-size: 14px; border-radius: 10px; background: rgba(255, 255, 255, 0.06); }
.stoplist div { display: flex; justify-content: space-between; gap: 8px; padding: 5px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
.stoplist div.dn { opacity: 0.45; }
.stoplist div.nx { background: rgba(240, 185, 11, 0.2); font-weight: 700; }
.stoplist span:last-child { white-space: nowrap; }
</style>

  }
  var splash = document.createElement('div');
  splash.id = 'splash';

      if (!cr.scolded && onRoad && cr.state === 'dash' && cdz > -6 && cdz < 24 && S.speed > 4) {
        cr.scolded = true;
        helperSay(SCOLD[Math.floor(Math.random() * SCOLD.length)], true);
        var rp = pk(REPLY), rwho = Math.random() < 0.3 ? 'pedF' : 'ped';
        setTimeout(function () { say(rwho, rp, 'queue'); }, 2300);
        if (bubbleT <= 0 && Math.random() < 0.7) {
          E.bubbleTxt.textContent = rp;
          E.bubble.hidden = false; bubbleT = 2.2; bubbleTarget = cr;
        }
      }
      if (Math.abs(cr.z - S.z) < PLAYER_LEN / 2 + 0.3 && Math.abs(cr.x - S.x) < 1.6 && onRoad) {
        scene.remove(cr.g); crossers.splice(i, 1);
        S.hp -= 20; S.comfort -= 20; S.vel *= 0.4;
        hitFx(); thump();
        toast('পথচারীকে ধাক্কা লেগেছে!', 2200);
        helperSay('আরে আরে! মানুষ! থামেন, থামেন!', true);
        if (S.hp <= 0) { endTrip('hp'); return; }
      }
    }
    updateCounters(dt);
    updateChatter(dt);
    for (i = 0; i < potholes.length; i++) {
      var pot = potholes[i];
      if (!pot.hit && Math.abs(pot.z - S.z) < 3 && Math.abs(pot.x - S.x) < 1.4 && S.speed > 6) { pot.hit = true; shake = 0.2; S.comfort -= 3; thump(); }
    }

    /* stops */
    var inZone = false, nx = null;
    for (i = 0; i < STOPS.length; i++) if (!STOPS[i].done) { nx = STOPS[i]; break; }
    for (i = 0; i < STOPS.length; i++) {
      var s = STOPS[i];
      var near = Math.abs(S.z - s.z) < 4.5 && Math.abs(S.x + 3.6) < 1.9;
      if (s.done && s.missed && near && Math.abs(S.vel) < 0.8) {
        s.done = false; s.missed = false; s.called = true;
        if (s.mesh && s.mesh.material) s.mesh.material.color.set(0xffffff);
        toast(s.name + ' স্টপে ফিরে এসেছ', 1800);
      }
      if (s.done) continue;
      if (near) {
        inZone = true;
        if (Math.abs(S.vel) < 0.8) {
          S.dwell += dt;
          if (S.dwell > 0.4 && S.dwell - dt <= 0.4) { toast('যাত্রী উঠছে…', 1800); helperSay('ওঠেন ওঠেন! পিছনে যান, পিছনে যান!'); }
          if (S.dwell >= 2) { S.dwell = 0; arrive(s); if (S.mode !== 'play') return; }
        } else S.dwell = 0;
      }
      if (S.z - s.z < -14) {
        if (s.final) { endTrip('missed'); return; }
        s.done = true; s.missed = true;
        if (s.mesh && s.mesh.material) s.mesh.material.color.set(0xb0a898);
        S.comfort -= 6;
        toast(s.name + ' স্টপ মিস হলো', 2200);
      }
    }
    if (!inZone) S.dwell = 0;
    if (nx && !nx.warned && !toastT && S.z - nx.z < 170 && S.z - nx.z > 60) {
      nx.warned = true;
      toast(nx.final ? 'গন্তব্য আসছে। বাঁয়ের লেনে থামো।' : nx.name + ' স্টপ আসছে। বাঁয়ের লেনে থামো।', 2600);
    }
    if (nx && !nx.called) {
      var dd = S.z - nx.z;
      if (dd < 220 && dd > 30 && helperSay(nx.name + ', ' + nx.name + '! ' + (nx.final ? 'শেষ স্টপ, সবাই নামেন!' : 'নামবেন নাকি? নামার লোক আগে আসেন!'))) nx.called = true;
    }
    idleT -= dt;
    if (idleT <= 0 && S.speed > 4) { helperSay(IDLE[Math.floor(Math.random() * IDLE.length)]); idleT = 14 + Math.random() * 8; }
    if (S.fuel <= 0 && S.speed < 0.3) { endTrip('fuel'); return; }
    S.comfort = Math.max(0, S.comfort);

    bubbleCool -= dt;
    if (bubbleCool <= 0 && bubbleT <= 0 && S.speed > 6) {
      for (i = 0; i < peds.length; i++) {
        var p = peds[i];
        if (Math.abs(p.z - S.z) < 5 && p.x - S.x < -3.9) {
          var bt2 = pk(BUBBLES);
          E.bubbleTxt.textContent = bt2;
          say(Math.random() < 0.3 ? 'pedF' : 'ped', bt2, 'skip', 0.9);
          bubbleT = 2.4; bubbleCool = 7; bubbleTarget = p; E.bubble.hidden = false;
          break;
        }
      }
    }
  }

  /* ================= frame loop: capped at 60 fps, resolution adapts if the device is slow ================= */
  var tmpV = new THREE.Vector3(), lastTs = 0, fAcc = 0, fN = 0, raiseWait = 0, shadowOn = true, wheelRad = 0.52;
  function applyDpr() { renderer.setPixelRatio(dpr); resize(); }
  function frame(ts) {
    requestAnimationFrame(frame);
    var raw = (ts - lastTs) / 1000;
    if (lastTs && raw * 1000 < 13.5) return;
    lastTs = ts;
    var dt = Math.min(0.05, raw > 0 ? raw : 0.016);
    fAcc += Math.min(raw, 0.2); fN++;
    if (fAcc >= 1) {
      var avg = fAcc / fN;
      E.fps.textContent = Math.round(fN / fAcc) + ' FPS';
      raiseWait -= fAcc;
      if (avg > 0.0205 && dpr > 0.55) { dpr = Math.max(0.55, dpr * 0.86); raiseWait = 6; applyDpr(); if (dpr < 0.75 && shadowOn) { shadowOn = false; sun.castShadow = false; } }
      else if (avg < 0.0176 && dpr < DPR_MAX && raiseWait <= 0) { dpr = Math.min(DPR_MAX, dpr * 1.1); raiseWait = 4; applyDpr(); }
      fAcc = 0; fN = 0;
    }
    if (S.mode === 'play') { step(dt); if (S.rain) stepRain(dt); }
    updateEngine();

    /* player bus */
    playerBus.position.set(S.x, 0, S.z);
    playerBus.rotation.y = -S.yaw;
    playerBus.rotation.z = Math.max(-0.06, Math.min(0.06, S.vel * S.vel / 5.0 * Math.tan(S.steer) * 0.0045));
    S.pitch += (Math.max(-0.045, Math.min(0.03, S.acc * 0.004)) - S.pitch) * Math.min(1, dt * 6);
    playerBus.rotation.x = S.pitch;
    var spin = S.vel * dt / wheelRad;
    for (var w = 0; w < busWheels.length; w++) busWheels[w].rotation.x -= spin;
    busWheels[0].rotation.order = 'YXZ'; busWheels[2].rotation.order = 'YXZ';
    busWheels[0].rotation.y = -S.steer; busWheels[2].rotation.y = -S.steer;
    if (S.vel < -0.3 && S.mode === 'play') { S.revBeepT -= dt; if (S.revBeepT <= 0) { revBeep(); S.revBeepT = 0.85; } }
    if (busBL) busBL.visible = S.brk > 0.3;
    helperFig.userData.arm.rotation.z = helperT > 0 ? 2.2 + Math.sin(performance.now() / 110) * 0.5 : 0.12 * Math.sin(performance.now() / 700);
    helperFig.rotation.z = 0.24 + Math.max(-0.1, Math.min(0.1, -S.acc * 0.02)) + (helperT > 0 ? 0.06 : 0);
    updateInterior(S.mode === 'play' ? dt : 0);

    sun.position.set(S.x + 22, 50, S.z + 16);
    sun.target.position.set(S.x, 0, S.z);
    head.position.set(S.x, 1.3, S.z - PLAYER_LEN / 2 + 0.2);
    head.target.position.set(S.x, 0, S.z - 30);
    ensureChunks(S.z, false);
    updateGlows();

    var cv = VIEWS[view];
    camX += (S.x * 0.75 - camX) * Math.min(1, dt * 5);
    if (shake > 0) shake -= dt;
    var sh = shake > 0 ? (Math.random() - 0.5) * shake * 1.2 : 0;
    var wantFov = (cv.fov || 58) + S.speed * 0.25;
    if (Math.abs(camera.fov - wantFov) > 0.05) { camera.fov = wantFov; camera.updateProjectionMatrix(); }
    var insideV = !!(cv.cockpit || cv.inside);
    var oyw = ((orbYaw + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
    var drv = !!cv.cockpit && Math.abs(oyw) < 0.8 && orbPit > -0.5 && orbPit < 0.5;
    playerBus.visible = !drv;
    pbT.g.visible = !insideV;
    for (var wi = 0; wi < busWheels.length; wi++) busWheels[wi].visible = !insideV;
    interior.visible = insideV && !drv;
    beam.visible = S.hl && !insideV;
    driverFig.visible = !cv.cockpit;
    cockpit.visible = drv;
    if (insideV) {
      if (cv.cockpit) _cp.set(0.62 + sh, 2.35 + sh * 0.5 + Math.sin(S.elapsed * 9) * 0.0008 * S.speed, -(PLAYER_LEN / 2 - 1.7));
      else _cp.set(0.1 + sh, 2.55 + sh * 0.5, -3.65);
      playerBus.updateMatrixWorld(true);
      camera.position.copy(_cp); playerBus.localToWorld(camera.position);
      var pcs = Math.cos(orbPit);
      _cd.set(Math.sin(oyw) * pcs, Math.sin(orbPit), -Math.cos(oyw) * pcs).multiplyScalar(30).add(_cp);
      playerBus.localToWorld(_cd);
      camera.lookAt(_cd);
      if (drv) updateCockpit(dt);
    } else {
      var bx = camX + sh, by = cv.y + sh * 0.5, bz = S.z + cv.d;
      var cx0 = S.x, cy0 = 1.9, cz0 = S.z;
      var ox = bx - cx0, oy2 = by - cy0, oz = bz - cz0;
      var hd = Math.sqrt(ox * ox + oz * oz) || 0.01;
      var ang = Math.atan2(ox, oz) + orbYaw, pit = Math.atan2(oy2, hd) + orbPit;
      pit = Math.max(0.02, Math.min(1.4, pit));
      var rr2 = Math.sqrt(hd * hd + oy2 * oy2) * orbR;
      camera.position.set(cx0 + Math.sin(ang) * Math.cos(pit) * rr2, Math.max(0.5, cy0 + Math.sin(pit) * rr2), cz0 + Math.cos(ang) * Math.cos(pit) * rr2);
      var kk = cv.orbit ? 1 : Math.min(1, (Math.abs(orbYaw) + Math.abs(orbPit)) * 1.6);
      var tx0 = S.x * 0.9, ty0 = cv.ly, tz0 = S.z - cv.la;
      camera.lookAt(tx0 + (cx0 - tx0) * kk, ty0 + (cy0 - ty0) * kk, tz0 + (cz0 - tz0) * kk);
    }
    sky.position.copy(camera.position);
    rain.visible = S.rain && S.mode !== 'menu';

    if (helperT > 0) { helperT -= dt; if (helperT <= 0) $('helper').hidden = true; }
    if (toastT > 0) { toastT -= dt * 1000; if (toastT <= 0) E.toast.hidden = true; }
    if (bubbleT > 0) {
      bubbleT -= dt;
      if (bubbleTarget) {
        tmpV.set(bubbleTarget.x, 2.6, bubbleTarget.z).project(camera);
        var cw = app.clientWidth, ch = app.clientHeight, col = $('hud').querySelector('.col').getBoundingClientRect();
        var px = (tmpV.x * 0.5 + 0.5) * cw - col.left, py = (-tmpV.y * 0.5 + 0.5) * ch;
        E.bubble.style.left = Math.max(8, Math.min(col.width - 230, px - 100)) + 'px';
        E.bubble.style.top = Math.max(260, Math.min(ch - 260, py - 70)) + 'px';
      }
      if (bubbleT <= 0) E.bubble.hidden = true;
    }
    miniT -= dt;
    if (miniT <= 0) { miniT = 0.12; drawMini(); updateHud(); updateEnv(); }
    renderer.render(scene, camera);
  }

  /* ---------- input ---------- */
  function hold(id, key) {
    var b = $(id);
    function on(e) { e.preventDefault(); keys[key] = true; b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (x) {} }
    function off(e) { keys[key] = false; b.classList.remove('on'); }
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  hold('bL', 'left'); hold('bR', 'right'); hold('bBrake', 'brake'); hold('bGas', 'gas');

  var KEYMAP = { ArrowUp: 'gas', w: 'gas', W: 'gas', ArrowDown: 'brake', s: 'brake', S: 'brake', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ' ': 'brake' };
  window.addEventListener('keydown', function (e) {
    if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; e.preventDefault(); }
    if (e.key === 'h' || e.key === 'H') horn();
    if (e.key === 'f' || e.key === 'F') toggleLight();
    if (e.key === 'j' || e.key === 'J') orbYaw += 0.15;
    if (e.key === 'l' || e.key === 'L') orbYaw -= 0.15;
    if (e.key === 'i' || e.key === 'I') orbPit = Math.max(-1.2, orbPit - 0.1);
    if (e.key === 'k' || e.key === 'K') orbPit = Math.min(1.2, orbPit + 0.1);
  });
  window.addEventListener('keyup', function (e) { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });

  $('pauseBtn').addEventListener('click', function () { if (S.mode === 'play') { S.mode = 'pause'; showPause(); } });
  function resetOrbit() {
    var v = VIEWS[view];
    orbYaw = v.inside ? Math.PI : v.orbit ? 0.7 : 0;
    orbPit = v.inside ? -0.1 : v.orbit ? 0.2 : 0;
    orbR = 1;
  }
  $('bCam').addEventListener('click', function () {
    view = (view + 1) % VIEWS.length; resetOrbit();
    toast(VIEW_NAMES[view] + (view === 0 ? '' : ' • ঘোরাতে স্ক্রিনে আঙুল টানো'), 2200);
  });
  var dragId = null, dragX = 0, dragY = 0;
  gl.style.touchAction = 'none';
  gl.addEventListener('pointerdown', function (e) {
    if (S.mode === 'menu') return;
    dragId = e.pointerId; dragX = e.clientX; dragY = e.clientY;
    try { gl.setPointerCapture(e.pointerId); } catch (x) {}
  });
  gl.addEventListener('pointermove', function (e) {
    if (e.pointerId !== dragId) return;
    var dx = e.clientX - dragX, dy = e.clientY - dragY, v = VIEWS[view], ins = v.cockpit || v.inside;
    dragX = e.clientX; dragY = e.clientY;
    orbYaw -= dx * 0.006;
    orbPit += dy * 0.004;
    orbPit = ins ? Math.max(-1.2, Math.min(1.2, orbPit)) : Math.max(-0.6, Math.min(1.0, orbPit));
  });
  function endDrag(e) { if (e.pointerId === dragId) dragId = null; }
  gl.addEventListener('pointerup', endDrag);
  gl.addEventListener('pointercancel', endDrag);
  gl.addEventListener('wheel', function (e) { e.preventDefault(); orbR = Math.max(0.5, Math.min(2.2, orbR * (e.deltaY > 0 ? 1.08 : 0.92))); }, { passive: false });
  $('bHorn').addEventListener('click', horn);
  $('bLight').addEventListener('click', toggleLight);
  $('bRain').addEventListener('click', function () {
    var ks = Object.keys(WEATHERS);
    changeWeather(ks[(ks.indexOf(S.weather) + 1) % ks.length]);
    S.wNext = S.elapsed * CLOCK_RATE + WEATHER_EVERY;
  });
  $('bReset').addEventListener('click', function () {
    var best = LX.reduce(function (a, b) { return Math.abs(b - S.x) < Math.abs(a - S.x) ? b : a; });
    S.x = best; S.vx = 0;
  });


  /* ================= boot ================= */
  function boot() {
    buildTemplates();
    resetState();
    ensureChunks(0, true);
    showMenu();
    updateHud(); updateEnv();
    window.__bootOk = true;
    setTimeout(hideSplash, 2300);
    requestAnimationFrame(frame);
  }
  var fontsReady = document.fonts && document.fonts.load ? document.fonts.load('700 20px "Hind Siliguri"', 'বাস') : Promise.resolve();
  Promise.race([fontsReady, new Promise(function (r) { setTimeout(r, 1500); })]).then(boot, boot);
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});</script>
